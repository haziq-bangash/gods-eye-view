# Render Blueprint for Nadelöhr: one Node web service that builds the app
# once and serves it with Vite's preview server, which also runs the data
# routes (/api/...). Connect the repository in Render (New → Blueprint) and
# it deploys main on every push. See the README's "Deploy" section.
services:
  - type: web
    name: nadeloehr
    runtime: node
    plan: free
    # Closest to German users and data sources.
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /
    envVars:
      # Same Node line as CI and the Dockerfile.
      - key: NODE_VERSION
        value: 24.22.2
      # Puppeteer is only used by QA scripts; skip its Chromium download.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: '1'
      # A custom domain, if you add one (comma-separated, no wildcards). The
      # *.onrender.com name is allowed automatically.
      - key: GEV_ALLOWED_HOSTS
        sync: false
      # The typed assistant ("Ask Nadelöhr") on this public site: admit chat
      # requests whose Origin is exactly this address (the server otherwise
      # answers AI requests only from the same machine), allow each visitor
      # 10 questions per Berlin day (and at most 10 requests a minute), and
      # offer Gemini only. Set GEMINI_API_KEY in the dashboard, from a
      # project without billing so the free tier is the hard cap. Voice
      # stays local-only.
      - key: GEV_PUBLIC_ASSISTANT_ORIGIN
        value: https://nadeloehr.dropboard.de
      - key: GEV_RATELIMIT_GEMINI_CHAT_PER_MIN
        value: '10'
      - key: GEV_PUBLIC_ASSISTANT_DAILY_QUESTIONS
        value: '10'
      - key: GEV_ASSISTANT_PROVIDER
        value: gemini
